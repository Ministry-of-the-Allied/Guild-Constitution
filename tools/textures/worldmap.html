<!doctype html>
<!--
  The game's Map & Quest Log, dressed (World map skins board, D5a, approved by Max 8 Nov):
  design/canvas-source/WorldMapSkins.dc.html, laid out with the canvas stylesheet plus
  the board's own styles. build.py renders it once per skin ({{skin}} is the board's
  class: sk-sh, sk-ex, sk-cr, sk-min), like layout.html.

  #wm         the whole window at (100, 100), 1100 x 749: the pieces drawn at their own size
              (title, knobs, buttons, arrows, the leather).
  #wm-samples below it: the parts the game stretches to the map's size, drawn small
              (the rim, bars, boxes, the log, the scroll track, the divider, the thumb, the
              crumbs). The game cuts them as nine-slices (Media.lua wmap.slice).
  No text is drawn but the title: the game's own words stay on its buttons and boxes.
-->
<html>
<head>
<meta charset="utf-8">
<style>
{{css}}
#wm-samples .mw-nav,#wm-samples .mw-search,#wm-samples .mw-count,#wm-samples .mw-zone,#wm-samples .mw-plate,
#wm-samples .mw-log,#wm-samples .mw-scroll,#wm-samples .mw-map,#wm-samples .mw-div,#wm-samples .mw-thumb{position:absolute}
#wm-samples .mw-map{background:transparent}
#wm-samples .mw-map::after{display:none}
/* the rim alone, hollow: the metal ring (its middle masked out), the dark hairline outside it,
   the inner shading and the rule, each its own layer */
#wm-rim{position:absolute;inset:0}
#wm-rim .ring{position:absolute;inset:0;box-shadow:none;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
#wm-rim .hair{position:absolute;inset:-1px;border:1px solid var(--dk);border-radius:9px}
#wm-rim .inner{position:absolute;inset:2px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.65),inset 0 2px 0 rgba(255,255,255,.1)}
#wm-rim .rule{position:absolute;inset:6px;border:1px solid var(--rule);border-radius:4px}
/* the seal with a tight shadow only: the board's soft 10 px one showed as a grey haze round
   the crest over the bright game world (Max, 8 Nov) */
#wm-seal{filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
/* the leather without its grain: the game tiles the grain over it (as the window does) */
#wm-leather::before{display:none}
#wm-leather{box-shadow:none;border-radius:0;background-size:0 0,100% 100%}
</style>
</head>
<body>
<div class="mw {{skin}}" id="wm" style="left: 100px; top: 100px">
  <div class="mw-rim" style="padding: 0; background: none; box-shadow: none"><div class="mw-hide" id="wm-leather"></div></div>
  <div class="mw-title" id="wm-title"><h3>Map &amp; Quest Log</h3></div>
  <img class="mw-seal {{crest_class}}" id="wm-seal" src="{{crest}}" alt="">
  <div class="mw-btns">
    <button class="mw-knob" id="wm-enlarge" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-7 7M10 5H5v14h14v-5"></path></svg></button>
    <button class="mw-knob wax" id="wm-close" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"></path></svg></button>
  </div>
  <button class="mw-track" id="wm-track" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6 7v6l-4 2v-8z"></path></svg></button>
  <button class="mw-reset" id="wm-reset" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
  <button class="mw-gear" id="wm-gear" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path></svg></button>
  <button class="mw-round" id="wm-round" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l6.5 8-6.5 8-6.5-8z"></path></svg></button>
  <button class="mw-toggle" id="wm-toggle" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6l6 6-6 6"></path></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 8.5a3.5 3.5 0 1 1 4.9 3.2c-.9.4-1.4 1.1-1.4 2v.8"></path><circle cx="12" cy="18.5" r="1.3" fill="currentColor" stroke="none"></circle></svg></button>
  <div class="mw-scroll" style="background: none; box-shadow: none">
    <button class="mw-arrow up" id="wm-up" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"></path></svg></button>
    <button class="mw-arrow dn" id="wm-down" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
  </div>
</div>

<div class="{{skin}}" id="wm-samples" style="position: absolute; left: 100px; top: 950px; width: 1100px; height: 420px">
  <div class="mw" id="wm-rimbox" style="left: 0; top: 0; width: 240px; height: 200px">
    <div id="wm-rim"><span class="hair"></span><div class="mw-rim ring"></div><span class="inner"></span><span class="rule"></span></div>
  </div>
  <div class="mw-sep" id="wm-sep" style="left: 280px; right: auto; top: 10px; width: 300px"></div>
  <div class="mw-nav" id="wm-nav" style="left: 280px; top: 40px; width: 140px"></div>
  <div class="mw-search" id="wm-search" style="left: 460px; top: 40px; width: 120px"></div>
  <div class="mw-count" id="wm-count" style="left: 620px; top: 40px; width: 100px"></div>
  <div class="mw-zone" id="wm-zone" style="left: 760px; top: 40px; width: 140px"></div>
  <div class="mw-plate" id="wm-plate" style="left: 280px; top: 110px; width: 120px"></div>
  <div class="mw-map" id="wm-maprim" style="left: 460px; top: 110px; width: 120px; height: 120px"></div>
  <div class="mw-log" id="wm-log" style="left: 620px; top: 110px; width: 160px; height: 160px"></div>
  <div class="mw-scroll" id="wm-scroll" style="left: 820px; top: 110px; height: 120px"></div>
  <div class="mw-div" id="wm-div" style="left: 870px; top: 110px; height: 120px"></div>
  <span class="mw-thumb" id="wm-thumb" style="left: 910px; top: 110px; height: 60px"></span>
  <!-- a crumb's dropdown chevron, the board's 11 x 11, in white: the game tints it to the crumb's ink -->
  <span id="wm-chev" style="position: absolute; left: 960px; top: 110px; width: 11px; height: 11px; display: block; color: #FFFFFF"><svg viewBox="0 0 24 24" width="11" height="11" style="display: block" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></span>
  <nav class="mw-nav" style="left: 0; top: 260px; width: 760px; background: none; box-shadow: none">
    <button class="crumb home" id="wm-home" type="button" style="width: 140px"></button>
    <button class="crumb" id="wm-step" type="button" style="width: 160px; margin-left: 40px"></button>
    <button class="crumb cur" id="wm-cur" type="button" style="width: 160px; margin-left: 40px"></button>
  </nav>
</div>

<script>
  // Where every element with an id sits on the page.
  const out = {};
  document.querySelectorAll('[id]').forEach(el => {
    const r = el.getBoundingClientRect();
    out[el.id] = { x: r.left, y: r.top, w: r.width, h: r.height };
  });
  const pre = document.createElement('pre');
  pre.id = 'rects-json';
  pre.style.display = 'none';
  pre.textContent = JSON.stringify(out);
  document.body.appendChild(pre);
</script>
</body>
</html>
