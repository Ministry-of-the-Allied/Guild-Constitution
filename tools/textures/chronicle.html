<!doctype html>
<!--
  The Chronicle book on the Throne Room (Max, 10 Nov 2026): a closed, leatherbound tome
  that opens with its pages flipping in holy light (UI/ChronicleBook.lua).

  It is drawn in 3D with CSS (perspective, rotateX, rotateY), so the cover and the pages turn
  with real perspective. tools/textures/chronicle.py renders it in Edge once per piece and
  angle; the game steps through the pictures. Open this file in a browser to see the open
  book (?closed for the closed one).

  Units are canvas units (the game's units). Every piece is placed from the top-left corner
  of #scene; the book lies on a table tilted back TILT degrees, its spine at x = SPINE.
-->
<html>
<head>
<meta charset="utf-8">
<style>
{{fonts}}
html,body{margin:0;background:transparent}
#scene{position:absolute;left:20px;top:20px;width:300px;height:290px;perspective:900px}
#world{position:absolute;left:0;top:0;width:300px;height:290px;transform-style:preserve-3d}
.g{position:absolute;transform-style:preserve-3d}
.f{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.f > *{position:absolute}
svg{overflow:visible;display:block}

/* leather: the window's own leather for the skin, with its grain */
.leather{background:var(--grain) 0 0/400px 400px,var(--leather);
  box-shadow:inset 0 0 0 .6px rgba(0,0,0,.7),inset 0 0 14px rgba(0,0,0,.45)}
.edge{background:linear-gradient(180deg,var(--edge-hi),var(--edge))}
.edge.side{background:linear-gradient(90deg,var(--edge),var(--edge-hi) 60%,var(--edge))}

/* the cover's outside: gold tooling */
.fillet{border:1px solid var(--metal-mid);border-radius:1.5px;box-shadow:0 0 0 .6px rgba(0,0,0,.45),inset 0 0 0 .6px rgba(0,0,0,.45)}
.blind{border:.8px solid rgba(0,0,0,.42);border-radius:1px;box-shadow:0 0 0 .5px rgba(255,255,255,.07)}
.groove{width:2.4px;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.2) 45%,rgba(255,255,255,.12) 70%,rgba(0,0,0,.35))}
.medal{border-radius:50%;background:var(--metal);box-shadow:0 1px 1.6px rgba(0,0,0,.7),inset 0 0 0 .7px var(--metal-dk)}
.medal-in{border-radius:50%;background:radial-gradient(ellipse at 50% 35%,var(--well-hi),var(--well) 70%);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.75),0 0 0 .6px var(--metal-dk)}
.emblem{background:var(--emblem) center/contain no-repeat;filter:drop-shadow(0 .8px .8px rgba(0,0,0,.6))}
.clasp{border-radius:2px 1px 1px 2px;background:var(--metal-h);box-shadow:0 1px 1.5px rgba(0,0,0,.65),inset 0 0 0 .6px var(--metal-dk)}
.stud{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,var(--gem) 45%,#000 120%);box-shadow:0 0 0 .7px var(--metal-dk)}
.strap{background:linear-gradient(180deg,var(--edge-hi),var(--edge));box-shadow:0 .6px 1px rgba(0,0,0,.6)}
.shade{inset:0;background:#000;pointer-events:none}

/* the cover's inside: leather turned in, a patterned endpaper */
.endpaper{background:radial-gradient(circle,var(--dot) 0 .55px,transparent .9px) 0 0/5px 5px,
  radial-gradient(circle,var(--dot) 0 .35px,transparent .7px) 2.5px 2.5px/5px 5px,var(--endpaper);
  box-shadow:0 0 0 .7px var(--metal-mid),inset 0 0 6px rgba(0,0,0,.5)}

/* pages: cream vellum; their edges gilt */
.page{background:var(--parch) 0 0/120px 120px,linear-gradient(90deg,#EFDDB3,#F7EBCD 30%,#F9EFD5)}
.page.l{background:var(--parch) 0 0/120px 120px,linear-gradient(270deg,#EFDDB3,#F7EBCD 30%,#F9EFD5)}
.gutter{background:var(--parch) 0 0/120px 120px,linear-gradient(90deg,#A88B55,#D3BC8C 40%,#EAD7AE 80%,#EFDDB3)}
.gutter.l{background:var(--parch) 0 0/120px 120px,linear-gradient(270deg,#A88B55,#D3BC8C 40%,#EAD7AE 80%,#EFDDB3)}
.gilt{background:repeating-linear-gradient(180deg,rgba(90,63,16,.0) 0 .55px,rgba(90,63,16,.38) .55px .85px),var(--metal)}
.glowy{background:rgba(255,226,150,.6);filter:blur(5px)}
.glowy.r{background:radial-gradient(ellipse 85% 70% at 10% 45%,rgba(255,236,170,.95) 0%,rgba(255,220,140,.55) 45%,rgba(255,210,120,.12) 85%,rgba(255,210,120,0) 100%)}
.glowy.l{background:radial-gradient(ellipse 85% 70% at 90% 45%,rgba(255,236,170,.95) 0%,rgba(255,220,140,.55) 45%,rgba(255,210,120,.12) 85%,rgba(255,210,120,0) 100%)}
.ribbon{box-shadow:0 .5px .8px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div id="scene"><div id="world"></div></div>
<script id="params" type="application/json">{{params}}</script>
<script>
(function () {
  let P = {};
  try { P = JSON.parse(document.getElementById('params').textContent); } catch (e) { P = {}; }
  if (!P.piece) P.piece = location.search.indexOf('closed') >= 0 ? 'closedFull' : 'full';
  const A = P.angle || 0;

  // The book, in canvas units: the spine at x = SPINE, the book's top edge at y = TOP (before the tilt).
  const SPINE = 150, TOP = 104, TILT = 32;
  const CW = 112, CH = 148, BT = 3;          // a cover board
  const BLK = 16, BLKO = 8;                 // the page block: closed, and each half when open
  const PIN = 3, PX0 = 0.4, PW = 107.6, PH = CH - 2 * PIN, G = 18, GA = 15;  // pages; the gutter's curve
  const scene = document.getElementById('scene'), world = document.getElementById('world');
  scene.style.perspectiveOrigin = SPINE + 'px ' + (TOP + CH / 2) + 'px';
  world.style.transformOrigin = SPINE + 'px ' + (TOP + CH / 2) + 'px';
  world.style.transform = 'rotateX(' + TILT + 'deg)';

  // The skin's colours (chronicle.py passes them; these are the Ministry's).
  const S = Object.assign({
    leather: 'radial-gradient(ellipse 90% 70% at 40% 0%,#3360B4 0%,#1E3B7C 34%,#142B5E 62%,#0B1838 100%)',
    edge: '#0B1838', edgeHi: '#1E3B7C', endpaper: '#1B3570', dot: 'rgba(243,217,138,.55)',
    well: '#0E1F45', wellHi: '#24468F', gem: '#2F5FD0', ribbon: ['#2E58AA', '#1B3570', '#12285A'],
    ribbon2: ['#F3D98A', '#C9A24A', '#8A6420'],
    metal: 'linear-gradient(180deg,#FFF3C4 0%,#EBCB7A 18%,#C9A24A 42%,#8A6420 58%,#C9A24A 76%,#F3D98A 100%)',
    metalH: 'linear-gradient(90deg,#8A6420 0%,#E9C877 22%,#FFF3C4 50%,#E9C877 78%,#8A6420 100%)',
    metalMid: '#C9A24A', metalDk: '#5A3F10', metalStops: ['#FFF1BF', '#E6C36C', '#A97E2C', '#EBCB7A', '#7A5719']
  }, P.skin || {});
  const vars = {
    '--leather': S.leather, '--edge': S.edge, '--edge-hi': S.edgeHi, '--endpaper': S.endpaper, '--dot': S.dot,
    '--well': S.well, '--well-hi': S.wellHi, '--gem': S.gem, '--metal': S.metal, '--metal-h': S.metalH,
    '--metal-mid': S.metalMid, '--metal-dk': S.metalDk,
    '--grain': P.grain ? 'url(' + P.grain + ')' : 'none', '--parch': P.parch ? 'url(' + P.parch + ')' : 'none',
    '--emblem': P.emblem ? 'url(' + P.emblem + ')' : 'none'
  };
  for (const k in vars) scene.style.setProperty(k, vars[k]);

  function div(parent, cls, x, y, w, h, tf, origin, style) {
    const d = document.createElement('div');
    d.className = cls;
    d.style.position = 'absolute';
    d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.width = w + 'px'; d.style.height = h + 'px';
    if (tf) d.style.transform = tf;
    if (origin) d.style.transformOrigin = origin;
    if (style) d.style.cssText += style;
    parent.appendChild(d);
    return d;
  }
  // A part on the table, in book coordinates (x from the spine, y from the book's top edge).
  function part(cls, x, y, w, h, tf, origin, style) { return div(world, cls, SPINE + x, TOP + y, w, h, tf, origin, style); }
  function smooth(t) { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); }
  function rad(a) { return a * Math.PI / 180; }

  // Faint lines of writing, drawn in an SVG at four times the size (no smallest-font limit).
  const WORDS = ('In the reign of the Crown the Ministry of the Allied was founded and the realm took counsel ' +
    'the citizens went to the polls and chose their representatives and the Chamber sat in the Keep ' +
    'laws were proposed and given Royal Assent the parties stood for election and the Court ruled ' +
    'honours were awarded to the faithful and champions rose in the Ring of the Gladiators ' +
    'so it is written in the Chronicle of the realm for every citizen to read in years to come').split(' ');
  let seed = 7;
  function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  function writing(w, h, opts) {
    const o = Object.assign({ size: 3.3, gap: 4.7, ink: 'rgba(74,54,30,.5)', start: 0 }, opts || {});
    const k = 4, rows = Math.floor((h - o.start) / o.gap);
    let s = '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w * k + ' ' + h * k + '">';
    let wi = Math.floor(rnd() * WORDS.length);
    for (let r = 0; r < rows; r++) {
      let line = '';
      while (line.length < 34) { line += (line ? ' ' : '') + WORDS[wi % WORDS.length]; wi++; }
      const last = (r + 1) % 7 === 0;
      const len = last ? w * (0.35 + 0.3 * rnd()) : w;
      s += '<text x="0" y="' + ((o.start + (r + 1) * o.gap) * k) + '" font-family="EB Garamond" font-style="italic" font-size="' +
        (o.size * k) + '" fill="' + o.ink + '" textLength="' + (len * k) + '" lengthAdjust="spacingAndGlyphs">' + line + '</text>';
    }
    return s + '</svg>';
  }
  function headpiece(w) {
    const k = 4, m = w / 2;
    return '<svg width="' + w + '" height="5" viewBox="0 0 ' + w * k + ' 20">' +
      '<line x1="0" y1="7" x2="' + w * k + '" y2="7" stroke="#A97E2C" stroke-width="1.6"/>' +
      '<line x1="0" y1="13" x2="' + w * k + '" y2="13" stroke="#A97E2C" stroke-width="0.8"/>' +
      '<path d="M' + (m * k - 10) + ' 10 L' + (m * k) + ' 1 L' + (m * k + 10) + ' 10 L' + (m * k) + ' 19 Z" fill="#8E2B22" stroke="#C9A24A" stroke-width="1.4"/></svg>';
  }
  function initial(letter) {
    return '<svg width="15" height="15" viewBox="0 0 60 60"><rect x="1" y="1" width="58" height="58" fill="#8E2B22" stroke="#C9A24A" stroke-width="3"/>' +
      '<rect x="6" y="6" width="48" height="48" fill="none" stroke="rgba(243,217,138,.5)" stroke-width="1"/>' +
      '<text x="30" y="47" text-anchor="middle" font-family="Cinzel Decorative" font-weight="900" font-size="46" fill="#F3D98A" stroke="#5A3F10" stroke-width="1">' + letter + '</text></svg>';
  }

  // What a page says. side: 'left' or 'right' as the open book lies; kind: 'title' or 'crest' (the open book) or 'text'.
  function pageContent(face, w, h, side, kind) {
    const inner = 22, outer = 10;  // the gutter side has the wider margin
    const x0 = side === 'left' ? outer : inner, tw = w - inner - outer;
    seed = kind === 'title' ? 11 : kind === 'crest' ? 23 : 31 + Math.floor(A);
    const hp = div(face, '', x0, 6, tw, 5); hp.innerHTML = headpiece(tw);
    if (kind === 'title') {
      const ini = div(face, '', x0, 16, 15, 15); ini.innerHTML = initial('T');
      const a = div(face, '', x0 + 17, 15, tw - 17, 16); a.innerHTML = writing(tw - 17, 16);
      const b = div(face, '', x0, 32, tw, 74); b.innerHTML = writing(tw, 74);
      div(face, '', x0 + 6, 112, tw - 12, 8, '', '', 'visibility:hidden').id = 'liveLine';
      const c = div(face, '', x0, 122, tw, 14); c.innerHTML = headpiece(tw).replace('height="5"', 'height="5" style="opacity:.8"');
    } else if (kind === 'crest') {
      const cx = x0 + tw / 2;
      const ring = div(face, 'medal', cx - 21, 16, 42, 42);
      const well = div(face, '', cx - 18, 19, 36, 36, '', '',
        'border-radius:50%;background:radial-gradient(circle at 50% 40%,#FFF8E0 0%,#F3D98A 45%,#C99A45 100%);box-shadow:inset 0 0 4px rgba(90,63,16,.6)');
      div(face, 'emblem', cx - 15, 21, 30, 32, '', '', 'background-image:var(--crest)');
      const b = div(face, '', x0, 62, tw, 72); b.innerHTML = writing(tw, 72);
    } else {
      const b = div(face, '', x0, 14, tw, 122); b.innerHTML = writing(tw, 122);
    }
  }

  // Gold corner fittings on the cover: a filigree bracket.
  function corner(face, x, y, rot) {
    const c = div(face, '', x, y, 20, 20, 'rotate(' + rot + 'deg)', '50% 50%');
    c.innerHTML = '<svg width="20" height="20" viewBox="0 0 160 160"><defs><linearGradient id="cg' + rot + '" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="' + S.metalStops[0] + '"/><stop offset=".25" stop-color="' + S.metalStops[1] + '"/>' +
      '<stop offset=".5" stop-color="' + S.metalStops[2] + '"/><stop offset=".72" stop-color="' + S.metalStops[3] + '"/>' +
      '<stop offset="1" stop-color="' + S.metalStops[4] + '"/></linearGradient></defs>' +
      '<g fill="url(#cg' + rot + ')" stroke="' + S.metalDk + '" stroke-width="3">' +
      '<path d="M4 4 H112 Q92 22 70 24 Q50 26 40 40 Q26 50 24 70 Q22 92 4 112 Z"/></g>' +
      '<g fill="none" stroke="' + S.metalDk + '" stroke-width="3.5" opacity=".75"><path d="M18 18 C40 22 54 30 58 46 C46 42 38 44 34 58 C30 54 22 40 18 18 Z"/></g>' +
      '<circle cx="22" cy="22" r="9" fill="' + S.gem + '" stroke="' + S.metalDk + '" stroke-width="3"/><circle cx="19" cy="19" r="3" fill="rgba(255,255,255,.75)"/></svg>';
  }

  // The cover's outside: leather, a gold fillet, a blind line, corner fittings, the title, the medallion, the clasp.
  function coverOutside(face) {
    div(face, 'groove', 9, 0, 2.4, CH);
    div(face, 'fillet', 14, 5, CW - 19, CH - 10);
    div(face, 'blind', 18, 9, CW - 27, CH - 18);
    corner(face, CW - 22, 2, 90); corner(face, CW - 22, CH - 22, 180);
    corner(face, 12, 2, 0); corner(face, 12, CH - 22, 270);
    const cx = 12 + (CW - 12) / 2;
    const t = div(face, '', cx - 36, 19, 72, 10);
    t.innerHTML = '<svg width="72" height="10" viewBox="0 0 288 40"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="' + S.metalStops[0] + '"/><stop offset=".45" stop-color="' + S.metalStops[2] + '"/>' +
      '<stop offset=".6" stop-color="' + S.metalStops[3] + '"/><stop offset="1" stop-color="' + S.metalStops[4] + '"/></linearGradient></defs>' +
      '<text x="144" y="31" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="27" letter-spacing="5" fill="url(#tg)" ' +
      'stroke="rgba(0,0,0,.55)" stroke-width="1.2" paint-order="stroke">CHRONICLE</text></svg>';
    const rule = div(face, '', cx - 26, 31, 52, 4);
    rule.innerHTML = '<svg width="52" height="4" viewBox="0 0 208 16"><line x1="0" y1="8" x2="208" y2="8" stroke="' + S.metalMid + '" stroke-width="2"/>' +
      '<path d="M94 8 L104 1 L114 8 L104 15 Z" fill="' + S.metalMid + '"/></svg>';
    div(face, 'medal', cx - 25, 45, 50, 58);
    div(face, 'medal-in', cx - 21.5, 48.5, 43, 51);
    div(face, 'emblem', cx - 18, 52, 36, 43);
    const rule2 = div(face, '', cx - 26, 113, 52, 4); rule2.innerHTML = rule.innerHTML;
    // the clasp's strap comes round the fore edge from the back cover and fastens on a gold hasp
    div(face, 'strap', CW - 13, CH / 2 - 6, 13, 12);
    div(face, 'clasp', CW - 17, CH / 2 - 9, 13, 18);
    div(face, 'stud', CW - 13.5, CH / 2 - 3, 6, 6);
  }
  function coverInside(face) {
    div(face, 'endpaper', 7, 6, CW - 13, CH - 12);
  }

  // The back cover, lying on the table.
  function backCover() {
    part('f leather', 0, 0, CW, CH, 'translateZ(' + BT + 'px)');
    part('f edge', 0, CH, CW, BT, 'translateZ(' + BT + 'px) rotateX(-90deg)', '50% 0');
  }
  // The front cover, turned a degrees about the spine. Its hinge drops as it opens, so it lands flat.
  function frontCover(a) {
    const h = BT + BLK * (1 - smooth((a - 30) / 150));
    const g = part('g', 0, 0, CW, CH, 'translateZ(' + h + 'px) rotateY(' + (-a) + 'deg)', '0 50%');
    const out = div(g, 'f leather', 0, 0, CW, CH, 'translateZ(' + BT + 'px)');
    coverOutside(out);
    const dark = Math.sin(rad(Math.min(a, 90))) * 0.42;
    if (dark > 0.005) div(out, 'shade', 0, 0, CW, CH, '', '', 'opacity:' + dark.toFixed(3));
    const inn = div(g, 'f leather', 0, 0, CW, CH, 'rotateY(180deg)');
    coverInside(inn);
    if (a < 180) {
      const lit = Math.sin(rad(a)) * 0.3;
      if (lit > 0.005) div(inn, 'shade', 0, 0, CW, CH, '', '', 'opacity:' + lit.toFixed(3));
    }
    div(g, 'f edge', 0, CH, CW, BT, 'translateZ(' + BT + 'px) rotateX(-90deg)', '50% 0');
    div(g, 'f edge side', CW, 0, BT, CH, 'translateZ(' + BT + 'px) rotateY(90deg)', '0 50%');
    return g;
  }
  function spineCap(z) {
    part('f edge', -5, CH, 7, z, 'translateZ(' + z + 'px) rotateX(-90deg)', '50% 0', 'border-radius:4px 0 0 4px');
  }
  // Ribbons: from the gutter, over the pages' edge and out on the table. x: where they lie; zTop: the pages' top.
  function ribbons(xs, zTop, yFrom) {
    const cols = [S.ribbon, S.ribbon2];
    xs.forEach(function (x, i) {
      const c = cols[i], bg = 'background:linear-gradient(90deg,' + c[2] + ',' + c[0] + ' 45%,' + c[1] + ')';
      if (yFrom < CH - PIN) part('f ribbon', x, yFrom, 4.5, CH - PIN - yFrom, 'translateZ(' + (zTop + 0.35) + 'px)', '', bg);
      part('f ribbon', x, CH - PIN + 0.5, 4.5, zTop, 'translateZ(' + (zTop + 0.35) + 'px) rotateX(-90deg)', '50% 0', bg);
      part('f ribbon', x, CH - PIN + 0.5, 4.5, 18 + 5 * i, 'translateZ(0.3px)', '',
        bg + ';clip-path:polygon(0 0,100% 0,100% 100%,50% 86%,0 100%)');
    });
  }

  // The closed book without its front cover: the back cover, the page block, the spine's end, the ribbons.
  function base() {
    backCover();
    part('f page', PX0, PIN, PW, PH, 'translateZ(' + (BT + BLK) + 'px)');
    part('f gilt', PX0, CH - PIN, PW, BLK, 'translateZ(' + (BT + BLK) + 'px) rotateX(-90deg)', '50% 0');
    spineCap(BT + BLK + BT);
    ribbons([8, 15], BT + BLK, CH);
  }
  // The light under the cover (the page block's top, blurred), shown when the cover lifts.
  function leak() { part('f glowy', PX0 + 2, PIN + 2, PW - 4, PH - 4, 'translateZ(' + (BT + BLK) + 'px)', '', 'overflow:visible'); }

  // The open book's covers: the back cover on the right, the front cover open on the left.
  function openCovers() { backCover(); frontCover(180); }
  // The open book's pages: each half block with its curve into the gutter.
  function openPages(glow) {
    const z = BT + BLKO;
    if (glow) {
      part('f glowy r', PX0, PIN, PW, PH, 'translateZ(' + z + 'px)', '', 'overflow:visible');
      part('f glowy l', -PX0 - PW, PIN, PW, PH, 'translateZ(' + z + 'px)', '', 'overflow:visible');
      return;
    }
    part('f gutter', PX0, PIN, G, PH, 'translateZ(' + z + 'px) rotateY(' + (-GA) + 'deg)', '100% 50%');
    const r = part('f page', PX0 + G, PIN, PW - G, PH, 'translateZ(' + z + 'px)');
    part('f gilt', PX0, CH - PIN, PW, BLKO, 'translateZ(' + z + 'px) rotateX(-90deg)', '50% 0');
    part('f gutter l', -PX0 - G, PIN, G, PH, 'translateZ(' + z + 'px) rotateY(' + GA + 'deg)', '0 50%');
    const l = part('f page l', -PX0 - PW, PIN, PW - G, PH, 'translateZ(' + z + 'px)');
    part('f gilt', -PX0 - PW, CH - PIN, PW, BLKO, 'translateZ(' + z + 'px) rotateX(-90deg)', '50% 0');
    // the writing sits on the whole page; the flat parts show all but the gutter's strip
    const lc = div(l, '', 0, 0, PW, PH); pageContent(lc, PW, PH, 'left', 'title');
    const rc = div(r, '', -G, 0, PW, PH); pageContent(rc, PW, PH, 'right', 'crest');
  }
  function openRibbons() { ribbons([5, -10], BT + BLKO, CH - PIN - 22); }

  // One page turning a degrees from the right to the left, in three strips so it curls.
  function turningPage(a) {
    const z = BT + BLKO + 0.6, curl = 13 * Math.sin(rad(a));
    const widths = [36, 36, PW - 72];
    const recto = document.createElement('div'), verso = document.createElement('div');
    pageContent(recto, PW, PH, 'right', 'text');
    pageContent(verso, PW, PH, 'left', 'text');
    const shadeR = 0.18 * Math.sin(rad(Math.min(a, 90))), shadeV = 0.18 * Math.sin(rad(Math.max(a, 90)));
    let parent = world, x0 = SPINE + PX0, y0 = TOP + PIN, tf = 'translateZ(' + z + 'px) rotateY(' + (-a) + 'deg)', at = 0;
    widths.forEach(function (w, i) {
      const g = div(parent, 'g', i === 0 ? x0 : widths[i - 1], i === 0 ? y0 : 0, w, PH, i === 0 ? tf : 'rotateY(' + curl + 'deg)', '0 50%');
      const lap = i < widths.length - 1 ? 0.6 : 0;   // a hair of overlap hides the seam between strips
      const front = div(g, 'f page', 0, 0, w + lap, PH);
      const fc = recto.cloneNode(true); fc.style.cssText = 'position:absolute;left:' + (-at) + 'px;top:0;width:' + PW + 'px;height:' + PH + 'px';
      front.appendChild(fc);
      if (shadeR > 0.005) div(front, 'shade', 0, 0, w, PH, '', '', 'opacity:' + shadeR.toFixed(3));
      const back = div(g, 'f page l', 0, 0, w + lap, PH, 'rotateY(180deg)');
      const bc = verso.cloneNode(true); bc.style.cssText = 'position:absolute;left:' + (-(PW - at - w)) + 'px;top:0;width:' + PW + 'px;height:' + PH + 'px';
      back.appendChild(bc);
      if (shadeV > 0.005) div(back, 'shade', 0, 0, w, PH, '', '', 'opacity:' + shadeV.toFixed(3));
      parent = g; at += w;
    });
  }

  const pieces = {
    base: base, leak: leak, cover: function () { frontCover(A); }, open: openCovers,
    pages: function () { openPages(false); }, glowOpen: function () { openPages(true); }, ribbons: openRibbons,
    page: function () { turningPage(A); },
    closedFull: function () { base(); frontCover(A); },
    full: function () { openCovers(); openPages(false); openRibbons(); }
  };
  (pieces[P.piece] || pieces.full)();
  if (P.crest) scene.style.setProperty('--crest', 'url(' + P.crest + ')');

  // Where the live line goes on the open book's left page, for the game (scene units).
  const live = document.getElementById('liveLine'), out = {};
  if (live) {
    const r = live.getBoundingClientRect(), s = scene.getBoundingClientRect();
    out.liveLine = { x: r.left - s.left, y: r.top - s.top, w: r.width, h: r.height };
  }
  const pre = document.createElement('pre');
  pre.id = 'rects-json'; pre.style.display = 'none'; pre.textContent = JSON.stringify(out);
  document.body.appendChild(pre);
})();
</script>
