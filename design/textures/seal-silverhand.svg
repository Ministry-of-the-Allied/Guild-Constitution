<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <defs>
    <radialGradient id="wax" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#C8D0DC"/>
      <stop offset="1" stop-color="#6E7A8C"/>
    </radialGradient>
    <radialGradient id="well" cx="56%" cy="58%" r="55%">
      <stop offset="0" stop-color="#D5DBE4"/>
      <stop offset=".8" stop-color="#A9B3C1"/>
      <stop offset="1" stop-color="#7D8898"/>
    </radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A74C8"/>
      <stop offset=".55" stop-color="#1F4290"/>
      <stop offset="1" stop-color="#132C66"/>
    </linearGradient>
    <filter id="drip" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="14" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <filter id="raise" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1.4" dy="1.8" stdDeviation=".8" flood-color="#3A4352" flood-opacity=".8"/>
    </filter>
    <path id="ring" d="M110 36 a74 74 0 1 1 -0.01 0"/>
  </defs>
  <g filter="url(#shadow)">
    <circle cx="110" cy="110" r="90" fill="url(#wax)" filter="url(#drip)"/>
  </g>
  <circle cx="110" cy="110" r="62" fill="url(#well)"/>
  <path d="M66 154 A62 62 0 0 1 154 66" stroke="#4E5868" stroke-opacity=".6" stroke-width="3" fill="none"/>
  <path d="M66 154 A62 62 0 0 0 154 66" stroke="#FFFFFF" stroke-opacity=".9" stroke-width="2.5" fill="none"/>
  <circle cx="110" cy="110" r="54" fill="none" stroke="#1F4290" stroke-opacity=".45" stroke-width="1.4" stroke-dasharray="1 5" stroke-linecap="round"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="12" letter-spacing="4" fill="#3E4859" fill-opacity=".85">
    <textPath href="#ring">✦ THE SILVERHAND ✦ THE LIGHT PROTECTS ALL ✦</textPath>
  </text>
  <g filter="url(#raise)" fill="url(#blue)">
    <rect x="91" y="78" width="8.5" height="40" rx="4.2"/>
    <rect x="100.5" y="70" width="8.5" height="46" rx="4.2"/>
    <rect x="110" y="72" width="8.5" height="44" rx="4.2"/>
    <rect x="119.5" y="80" width="8" height="38" rx="4"/>
    <rect x="90" y="102" width="38" height="36" rx="11"/>
    <rect x="77" y="104" width="8.5" height="30" rx="4.2" transform="rotate(-38 81 120)"/>
    <rect x="94" y="139" width="30" height="8" rx="2"/>
  </g>
  <path d="M110 58 V64 M86 64 L89 69 M134 64 L131 69 M74 78 L79 81 M146 78 L141 81" stroke="#1F4290" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  <ellipse cx="80" cy="66" rx="30" ry="14" fill="#fff" opacity=".45" transform="rotate(-32 80 66)"/>
</svg>
