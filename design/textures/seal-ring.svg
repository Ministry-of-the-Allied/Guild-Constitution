<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <!-- The Seal of the State as used on the Ring page: dark emerald wax, gold portcullis with chains. -->
  <defs>
    <radialGradient id="wax" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#2F8A5E"/>
      <stop offset=".45" stop-color="#0F4A33"/>
      <stop offset="1" stop-color="#03170E"/>
    </radialGradient>
    <radialGradient id="well" cx="56%" cy="58%" r="55%">
      <stop offset="0" stop-color="#16593E"/>
      <stop offset=".8" stop-color="#0C3D29"/>
      <stop offset="1" stop-color="#052318"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF0B8"/>
      <stop offset=".45" stop-color="#E3BE62"/>
      <stop offset=".58" stop-color="#A97E2C"/>
      <stop offset="1" stop-color="#F1D486"/>
    </linearGradient>
    <filter id="drip" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="raise" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1.4" dy="1.8" stdDeviation=".8" flood-color="#021008" flood-opacity=".85"/>
    </filter>
    <path id="ring" d="M110 36 a74 74 0 1 1 -0.01 0"/>
  </defs>
  <g filter="url(#shadow)">
    <circle cx="110" cy="110" r="90" fill="url(#wax)" filter="url(#drip)"/>
  </g>
  <circle cx="110" cy="110" r="62" fill="url(#well)"/>
  <path d="M66 154 A62 62 0 0 1 154 66" stroke="#021008" stroke-opacity=".7" stroke-width="3" fill="none"/>
  <path d="M66 154 A62 62 0 0 0 154 66" stroke="#7FD1A8" stroke-opacity=".4" stroke-width="2.5" fill="none"/>
  <circle cx="110" cy="110" r="54" fill="none" stroke="#E3BE62" stroke-opacity=".45" stroke-width="1.4" stroke-dasharray="1 5" stroke-linecap="round"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="12" letter-spacing="3.4" fill="#A6DBC0" fill-opacity=".8">
    <textPath href="#ring">✦ SEALED IN STORMWIND ✦ FOR THE ALLIANCE ✦</textPath>
  </text>
  <g filter="url(#raise)" fill="url(#gold)" transform="translate(110 110) scale(.88) translate(-50 -50)">
  <rect x="17" y="15" width="66" height="8" rx="1.6"/>
  <path d="M21.5 23h5v57l-2.5 6-2.5-6zM34.5 23h5v57l-2.5 6-2.5-6zM47.5 23h5v57l-2.5 6-2.5-6zM60.5 23h5v57l-2.5 6-2.5-6zM73.5 23h5v57l-2.5 6-2.5-6z"/>
  <rect x="19" y="35" width="62" height="4.4"/><rect x="19" y="50" width="62" height="4.4"/><rect x="19" y="65" width="62" height="4.4"/>
  <g fill="none" stroke="url(#gold)" stroke-width="1.8">
    <ellipse cx="13.5" cy="24" rx="2.4" ry="3.6" transform="rotate(30 13.5 24)"/>
    <ellipse cx="9.8" cy="31" rx="2.4" ry="3.6" transform="rotate(18 9.8 31)"/>
    <ellipse cx="7.6" cy="38.6" rx="2.4" ry="3.6" transform="rotate(6 7.6 38.6)"/>
    <circle cx="7" cy="46.5" r="3.6"/>
    <ellipse cx="86.5" cy="24" rx="2.4" ry="3.6" transform="rotate(-30 86.5 24)"/>
    <ellipse cx="90.2" cy="31" rx="2.4" ry="3.6" transform="rotate(-18 90.2 31)"/>
    <ellipse cx="92.4" cy="38.6" rx="2.4" ry="3.6" transform="rotate(-6 92.4 38.6)"/>
    <circle cx="93" cy="46.5" r="3.6"/>
  </g>
  <path d="M18 19h64" stroke="#5A3F10" stroke-opacity=".45" stroke-width=".8"/>
  </g>
  <ellipse cx="80" cy="66" rx="30" ry="14" fill="#fff" opacity=".14" transform="rotate(-32 80 66)"/>
</svg>
