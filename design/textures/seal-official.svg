<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <defs>
    <radialGradient id="wax" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#B9503F"/>
      <stop offset=".45" stop-color="#6E1712"/>
      <stop offset="1" stop-color="#2C0705"/>
    </radialGradient>
    <radialGradient id="well" cx="56%" cy="58%" r="55%">
      <stop offset="0" stop-color="#7C2219"/>
      <stop offset=".8" stop-color="#5A130E"/>
      <stop offset="1" stop-color="#330806"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF0B8"/>
      <stop offset=".45" stop-color="#E3BE62"/>
      <stop offset=".58" stop-color="#A97E2C"/>
      <stop offset="1" stop-color="#F1D486"/>
    </linearGradient>
    <filter id="drip" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="raise" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1.4" dy="1.8" stdDeviation=".8" flood-color="#1E0403" flood-opacity=".85"/>
    </filter>
    <path id="ring" d="M110 36 a74 74 0 1 1 -0.01 0"/>
  </defs>
  <g filter="url(#shadow)">
    <circle cx="110" cy="110" r="90" fill="url(#wax)" filter="url(#drip)"/>
  </g>
  <circle cx="110" cy="110" r="62" fill="url(#well)"/>
  <path d="M66 154 A62 62 0 0 1 154 66" stroke="#1E0403" stroke-opacity=".7" stroke-width="3" fill="none"/>
  <path d="M66 154 A62 62 0 0 0 154 66" stroke="#E39A84" stroke-opacity=".45" stroke-width="2.5" fill="none"/>
  <circle cx="110" cy="110" r="54" fill="none" stroke="#E3BE62" stroke-opacity=".45" stroke-width="1.4" stroke-dasharray="1 5" stroke-linecap="round"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="12" letter-spacing="3.4" fill="#E9A996" fill-opacity=".8">
    <textPath href="#ring">✦ SEALED IN STORMWIND ✦ FOR THE ALLIANCE ✦</textPath>
  </text>
  <g filter="url(#raise)" fill="url(#gold)">
    <path fill-rule="evenodd" d="M82 144 V92 H90 V100 H98 V92 H106 V100 H114 V92 H122 V100 H130 V92 H138 V144 Z M102 144 V126 Q110 114 118 126 V144 Z M92 108 h4 v11 h-4 Z M124 108 h4 v11 h-4 Z"/>
    <rect x="109" y="70" width="2.4" height="22"/>
    <path d="M111.4 70 L126 75 L111.4 80 Z"/>
  </g>
  <ellipse cx="80" cy="66" rx="30" ry="14" fill="#fff" opacity=".16" transform="rotate(-32 80 66)"/>
</svg>
