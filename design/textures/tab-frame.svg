<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1BF"/>
      <stop offset=".22" stop-color="#E6C36C"/>
      <stop offset=".48" stop-color="#A97E2C"/>
      <stop offset=".7" stop-color="#EBCB7A"/>
      <stop offset="1" stop-color="#7A5719"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx=".4" dy=".7" stdDeviation=".45" flood-color="#2A1D06" flood-opacity=".8"/>
    </filter>
    <!-- a small copy of the window's filigree corner: rounded bracket, two scrolls, leaves and a jewelled boss -->
    <g id="scrolls" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 7 C10.4 6.2 12.6 6.9 13.5 8.8 C14.2 10.3 13 11.6 11.7 11.1 C10.7 10.7 10.9 9.5 11.8 9.6"/>
      <path d="M7 7 C6.2 10.4 6.9 12.6 8.8 13.5 C10.3 14.2 11.6 13 11.1 11.7 C10.7 10.7 9.5 10.9 9.6 11.8"/>
      <path d="M13.5 8.8 C15.2 7.5 16.6 7.2 17.8 6.7" stroke-width=".8"/>
      <path d="M8.8 13.5 C7.5 15.2 7.2 16.6 6.7 17.8" stroke-width=".8"/>
    </g>
    <g id="leaves">
      <path d="M15 6.8 C15.9 5.2 17.2 4.8 18.2 5.1 C17.5 6.4 16.2 7.1 15 6.8 Z"/>
      <path d="M6.8 15 C5.2 15.9 4.8 17.2 5.1 18.2 C6.4 17.5 7.1 16.2 6.8 15 Z"/>
      <circle cx="4.8" cy="4.8" r="4"/>
    </g>
    <g id="corner">
      <g filter="url(#s)">
        <path d="M1.8 16.5 V6.4 Q1.8 1.8 6.4 1.8 H16.5" fill="none" stroke="#4A330C" stroke-width="2.9" stroke-linecap="round"/>
        <path d="M1.8 16.5 V6.4 Q1.8 1.8 6.4 1.8 H16.5" fill="none" stroke="url(#g)" stroke-width="1.9" stroke-linecap="round"/>
        <use href="#scrolls" stroke="#4A330C" stroke-width="2.1"/>
        <use href="#leaves" fill="#4A330C" stroke="#4A330C" stroke-width="1"/>
        <use href="#scrolls" stroke="url(#g)" stroke-width="1.1"/>
        <use href="#leaves" fill="url(#g)"/>
      </g>
      <circle cx="4.8" cy="4.8" r="2.5" fill="#2A4FA0" stroke="#0E1F45" stroke-width=".6"/>
      <circle cx="4.1" cy="4.1" r=".8" fill="#C6D8FF" opacity=".9"/>
    </g>
  </defs>
  <!-- the window's double gold rule and stitched line, engraved into the gold -->
  <rect x="3.5" y="3.5" width="53" height="53" fill="none" stroke="#5A3F10" stroke-opacity=".85" stroke-width="1"/>
  <rect x="4.4" y="4.4" width="51.2" height="51.2" fill="none" stroke="#FFF6D2" stroke-opacity=".7" stroke-width=".6"/>
  <rect x="6.5" y="6.5" width="47" height="47" fill="none" stroke="#6E4F17" stroke-opacity=".55" stroke-width=".7" stroke-dasharray="2 2"/>
  <use href="#corner"/>
  <use href="#corner" transform="translate(60 0) scale(-1 1)"/>
  <use href="#corner" transform="translate(0 60) scale(1 -1)"/>
  <use href="#corner" transform="translate(60 60) scale(-1 -1)"/>
</svg>
