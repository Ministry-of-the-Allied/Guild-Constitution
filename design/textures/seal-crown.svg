<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <defs>
    <radialGradient id="wax" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#5B86DA"/>
      <stop offset=".45" stop-color="#23469A"/>
      <stop offset="1" stop-color="#0B1B44"/>
    </radialGradient>
    <radialGradient id="well" cx="56%" cy="58%" r="55%">
      <stop offset="0" stop-color="#2A4E9E"/>
      <stop offset=".8" stop-color="#16306C"/>
      <stop offset="1" stop-color="#0A1838"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF0B8"/>
      <stop offset=".45" stop-color="#E3BE62"/>
      <stop offset=".58" stop-color="#A97E2C"/>
      <stop offset="1" stop-color="#F1D486"/>
    </linearGradient>
    <filter id="drip" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="raise" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1.4" dy="1.8" stdDeviation=".8" flood-color="#050E26" flood-opacity=".8"/>
    </filter>
    <path id="ring" d="M110 36 a74 74 0 1 1 -0.01 0"/>
  </defs>
  <g filter="url(#shadow)">
    <circle cx="110" cy="110" r="90" fill="url(#wax)" filter="url(#drip)"/>
  </g>
  <circle cx="110" cy="110" r="62" fill="url(#well)"/>
  <path d="M66 154 A62 62 0 0 1 154 66" stroke="#040B20" stroke-opacity=".65" stroke-width="3" fill="none"/>
  <path d="M66 154 A62 62 0 0 0 154 66" stroke="#9DBBF7" stroke-opacity=".55" stroke-width="2.5" fill="none"/>
  <circle cx="110" cy="110" r="54" fill="none" stroke="#C9A24A" stroke-opacity=".55" stroke-width="1.4" stroke-dasharray="1 5" stroke-linecap="round"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="11.5" letter-spacing="3.2" fill="#A9C2F2" fill-opacity=".85">
    <textPath href="#ring">✦ MINISTRY OF THE ALLIED ✦ STORMWIND ✦ BY THE CROWN</textPath>
  </text>
  <g filter="url(#raise)" fill="url(#gold)">
    <path d="M78 128 L72 92 L92 110 L110 82 L128 110 L148 92 L142 128 Z"/>
    <rect x="77" y="129" width="66" height="11" rx="1.5"/>
    <circle cx="72" cy="89" r="4.6"/>
    <circle cx="110" cy="78.5" r="5.2"/>
    <circle cx="148" cy="89" r="4.6"/>
  </g>
  <circle cx="94" cy="134.5" r="2.4" fill="#1B3570"/>
  <circle cx="110" cy="134.5" r="2.8" fill="#8E2B22"/>
  <circle cx="126" cy="134.5" r="2.4" fill="#1B3570"/>
  <ellipse cx="80" cy="66" rx="30" ry="14" fill="#fff" opacity=".16" transform="rotate(-32 80 66)"/>
