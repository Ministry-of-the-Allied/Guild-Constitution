<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <defs>
    <radialGradient id="wax" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#E5584C"/>
      <stop offset=".45" stop-color="#9E1B22"/>
      <stop offset="1" stop-color="#43060C"/>
    </radialGradient>
    <radialGradient id="well" cx="56%" cy="58%" r="55%">
